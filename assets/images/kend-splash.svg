<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,700;1,700&amp;family=Noto+Sans+KR:wght@500;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#FFEED0"/>

  <!-- Corner accents (Direction A — 미니멀 리파인) -->
  <!-- 과거 버전은 이 opacity를 0.04로 설계했으나 PNG 익스포트 시 불투명하게 렌더되어
       코너가 진한 쿼터서클로 보이는 문제가 있었다. 가는 아크 라인 + 오렌지 포인트로 교체. -->
  <path d="M0,174 A174,174 0 0 1 174,0" stroke="#1A3F66" stroke-opacity="0.16" stroke-width="4.5" fill="none"/>
  <circle cx="168" cy="12" r="10.5" fill="#FF8A1F"/>
  <path d="M1080,1794 A174,174 0 0 1 906,1920" stroke="#1A3F66" stroke-opacity="0.16" stroke-width="4.5" fill="none"/>
  <circle cx="912" cy="1908" r="10.5" fill="#FF8A1F"/>

  <!-- KEND wordmark - Arimo Italic Bold -->
  <text
    x="540"
    y="960"
    font-family="Arimo, Arial, sans-serif"
    font-size="180"
    font-weight="700"
    font-style="italic"
    fill="#1A3F66"
    text-anchor="middle"
    letter-spacing="-3"
  >KEND</text>

  <!-- Underline accent (오렌지 포인트) -->
  <rect x="315" y="978" width="450" height="6" rx="3" fill="#FF8A1F"/>

  <!-- Tagline: Kids are an ENDuser -->
  <text
    x="540"
    y="1050"
    font-family="'Noto Sans KR', Arial, sans-serif"
    font-size="36"
    font-weight="500"
    fill="#454B56"
    text-anchor="middle"
    letter-spacing="4.5"
  >KIDS ARE AN ENDUSER</text>
</svg>
